# WARNING: Pushing/merging this workflow to main while DEPLOYMENT_TOKEN is set
# triggers a production deploy of qpub-server (repository_dispatch → qpub-deployment).
# Do not merge onto main until the Phase 3 server deploy gate in PRODUCTION_CUTOVER.md.

name: Build and Dispatch Deploy (Server)

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  APP_NAME: qpub-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/qpubio/${{ env.APP_NAME }}:latest
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger deployment
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOYMENT_TOKEN }}" \
            https://api.github.com/repos/qpubio/qpub-deployment/dispatches \
            -d '{
              "event_type":"server-built",
              "client_payload":{
                "service":"'${{ env.APP_NAME }}'",
                "image":"'${{ env.REGISTRY }}'/qpubio/'${{ env.APP_NAME }}'",
                "digest":"'${{ steps.build.outputs.digest }}'"
              }
            }'
